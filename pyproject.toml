[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "easy-to-shot"
dynamic = ["version"]
description = "Windows 桌面截图工具"
requires-python = ">=3.13"
dependencies = [
    "PySide6==6.10.2",
    "PySide6-Fluent-Widgets==1.11.3",
    "Pillow>=11",
    "zxing-cpp>=2.3,<4",
    "rapidocr>=3.10,<3.11",
    "onnxruntime>=1.20.1,<2",
    "pywin32-ctypes>=0.2.3,<0.3; sys_platform == 'win32'",
    "comtypes>=1.4.11,<2; sys_platform == 'win32'",
    "imageio-ffmpeg>=0.6,<1",
    "dxcam==0.1.0; sys_platform == 'win32'",
    "PyAudioWPatch>=0.2.12.7,<0.3; sys_platform == 'win32'",
]

[project.optional-dependencies]
test = ["pytest>=9,<10"]

[project.gui-scripts]
easy-to-shot = "e2s.app.bootstrap:main"

[tool.setuptools.dynamic]
version = {attr = "e2s.__version__"}

[tool.setuptools.package-data]
e2s = ["ui/native/assets/*.svg", "ui/native/assets/*.png"]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
